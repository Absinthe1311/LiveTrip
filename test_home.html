<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home.tsx 测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
        }
        .test-info {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
        }
        .test-info h2 {
            margin-top: 0;
            color: #0050b3;
        }
        .test-info ul {
            margin-bottom: 0;
        }
        .test-info li {
            margin-bottom: 8px;
        }
        .test-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background: #e8e8e8;
        }
        .status-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }
        .status-logged-out {
            background: #fff1f0;
            color: #ff4d4f;
            border: 1px solid #ffa39e;
        }
        .status-logged-in {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .test-results {
            background: #fafafa;
            border: 1px solid #d9d9d9;
            padding: 16px;
            border-radius: 4px;
        }
        .test-results h3 {
            margin-top: 0;
        }
        .test-result-item {
            padding: 12px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .test-result-item.pass {
            border-left: 4px solid #52c41a;
        }
        .test-result-item.fail {
            border-left: 4px solid #ff4d4f;
        }
        .test-result-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .test-result-desc {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Home.tsx 功能测试</h1>

        <div class="test-info">
            <h2>测试说明</h2>
            <p>此页面用于测试 Home.tsx 的登录态/未登录态条件渲染功能。</p>
            <ul>
                <li><strong>未登录态：</strong>应显示 Hero 区域、核心特色、热门目的地等营销内容</li>
                <li><strong>已登录态：</strong>应显示工作台视图，包括欢迎区域、创建新行程入口、我的行程、数据概览、热门目的地（精简版）</li>
            </ul>
        </div>

        <div style="margin-bottom: 24px;">
            <strong>当前登录状态：</strong>
            <span id="statusIndicator" class="status-indicator status-logged-out">未登录</span>
        </div>

        <div class="test-actions">
            <button class="btn btn-primary" onclick="simulateLogin()">模拟登录</button>
            <button class="btn btn-secondary" onclick="simulateLogout()">模拟退出登录</button>
            <button class="btn btn-secondary" onclick="openHomepage()">打开首页</button>
            <button class="btn btn-secondary" onclick="runTests()">运行自动化测试</button>
        </div>

        <div class="test-results" id="testResults" style="display: none;">
            <h3>测试结果</h3>
            <div id="testResultsList"></div>
        </div>
    </div>

    <script>
        // 检查当前登录状态
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            const statusIndicator = document.getElementById('statusIndicator');
            if (user) {
                statusIndicator.className = 'status-indicator status-logged-in';
                statusIndicator.textContent = `已登录 (${JSON.parse(user).username})`;
            } else {
                statusIndicator.className = 'status-indicator status-logged-out';
                statusIndicator.textContent = '未登录';
            }
        }

        // 模拟登录
        function simulateLogin() {
            const user = {
                id: '1',
                username: '测试用户',
                email: 'test@example.com'
            };
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('token', 'test-token');
            checkLoginStatus();
            alert('已模拟登录！点击"打开首页"查看已登录态的工作台视图。');
        }

        // 模拟退出登录
        function simulateLogout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            checkLoginStatus();
            alert('已模拟退出登录！点击"打开首页"查看未登录态的营销页面。');
        }

        // 打开首页
        function openHomepage() {
            window.open('http://localhost:5173/', '_blank');
        }

        // 运行自动化测试
        function runTests() {
            const results = [];

            // 测试1：未登录态
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            results.push({
                title: '未登录态测试',
                desc: 'localStorage 中无 user 数据，应显示未登录态',
                pass: !localStorage.getItem('user')
            });

            // 测试2：已登录态
            localStorage.setItem('user', JSON.stringify({ username: '测试用户' }));
            results.push({
                title: '已登录态测试',
                desc: 'localStorage 中有 user 数据，应显示已登录态',
                pass: !!localStorage.getItem('user')
            });

            // 显示测试结果
            const testResultsDiv = document.getElementById('testResults');
            const testResultsList = document.getElementById('testResultsList');
            testResultsDiv.style.display = 'block';
            testResultsList.innerHTML = '';

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = `test-result-item ${result.pass ? 'pass' : 'fail'}`;
                item.innerHTML = `
                    <div class="test-result-title">${result.title} - ${result.pass ? '✅ 通过' : '❌ 失败'}</div>
                    <div class="test-result-desc">${result.desc}</div>
                `;
                testResultsList.appendChild(item);
            });

            // 恢复登录状态
            checkLoginStatus();
        }

        // 页面加载时检查登录状态
        window.onload = function() {
            checkLoginStatus();
        };
    </script>
</body>
</html>
